<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <style>
            body {
                width: 200px;
                padding: 10px;
            }
            button {
                width: 100%;
                margin: 5px 0;
                padding: 8px;
                border: none;
                border-radius: 4px;
                background-color: #f0f0f0;
                cursor: pointer;
            }
            button.active {
                background-color: #4caf50;
                color: white;
            }
        </style>
    </head>
    <body>
        <button id="toggleAutoRead">Auto-Read: OFF</button>
        <button id="toggleAutoLike">Auto-Like: OFF</button>
        <button id="toggleShowFloat">Show Float: ON</button>
        <script src="popup.js"></script>
    </body>
</html>
